<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <form action="about.html" method="get">
        <fieldset>
            <legend><h3>Job Application</h3></legend>
            <label for="First Name">First Name*</label>
            <input type="text" id="First Name" required>
            <label for="Last Name">Last Name*</label>
            <input type="text" id="Last Name" required>
            <br><br>
            <label for="Email">Email*</label>
            <input type="email" id="Email" name="email"placeholder="Enter Email" required >
            <br><br>
            <label for="dob">Date of Birth*</label>
            <input type="date" value="" id="dob">
            <label for="age">Age*</label>
            <input type="numbers" id="age" min="20" max="60"> 
            <br><br>
            <label for="Gender">Gender</label>
            <input type="radio" id="male" name="Gender" value="male" required>
            <label for="Male">Male</label>
            <input type="radio" id="Female" name="Gender" value="Female" required>
            <label for="Male">Female</label>
            <br><br>
            <label for="jobs">Position Available:</label>
            <select name="" id="">
                <option value="">Python developer</option>
                <option value="" selected>Java developer</option>
                <option value="">full stack developer</option>
            </select>
            <br><br>
            <label for="">Programming Languages</label>
            <input type="checkbox">
            <label for="">python</label>
            <input type="checkbox" >
            <label for="">Java</label>
            <br><br>
            <label for="portfolio">portfolio website</label>
            <input type="url" id="portfolio" placeholder="Enter URL">
            <br><br>
            <label for="">Upolad Resume</label>
            <input type="file">
            <br><br>
            <label for="">Message</label>
            <textarea name="" id="" rows="3" cols="30">ask questions</textarea>
        </fieldset>
         </form>
    <form action="">
        <fieldset>
            <legend>Education*</legend>
            <label for="">Name of Institute*</label>
            <input type="text">
            <br><br>
            <label for="">Branch*</label>
            <input type="text">
            <br><br>
            <label for="">CGPA*</label>
            <input type="number">
            <br><br>
            <label for="">Location</label>
            <input type="text">
            <br><br>

        </fieldset>
    </form>
    <form action="">
        <fieldset>
            <legend>Experience*</legend>
            <label for="">How many years of experience*</label>
            <input type="number"><br><br>
            <label for="">Name of organization*</label>
            <input type="text">
            <br><br>
            <label for="">Year of Join</label>
            <input type="date">
            <br><br>
            <button type="Submit">Submit</button>
            <input type="reset">
            <br>
        </fieldset>

    </form>

</body>
</html>
